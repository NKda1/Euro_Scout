<!doctype html>
<html lang="en">
  <head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><style>@media(max-width:600px){.mail{margin:0!important;border-radius:0!important}}@media(prefers-color-scheme:dark){body{background:#090909!important;color:#fff!important}.mail{background:#111!important;border-color:#292929!important}.copy{color:#d1d5db!important}.muted{color:#9ca3af!important}}</style></head>
  <body style="margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a">
    <div class="mail" style="max-width:560px;margin:32px auto;background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden">
      <div style="background:#dc2626;padding:24px 28px;color:#fff"><strong style="font-size:20px">EuroScout Pro</strong></div>
      <div style="padding:28px">
        <h1 style="margin:0 0 12px;font-size:22px">You have been invited</h1>
        <p class="copy" style="margin:0 0 22px;line-height:1.6;color:#475569">Accept your secure invitation to join EuroScout Pro.</p>
        <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=invite" style="display:inline-block;background:#dc2626;color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:7px">Accept invitation</a>
        <p class="muted" style="margin:22px 0 0;font-size:12px;line-height:1.6;color:#64748b">This invitation was sent to {{ .Email }}.</p>
      </div>
    </div>
  </body>
</html>
