<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a">
    <div style="max-width:560px;margin:32px auto;background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden">
      <div style="background:#dc2626;padding:24px 28px;color:#fff"><strong style="font-size:20px">EuroScout Pro</strong></div>
      <div style="padding:28px">
        <h1 style="margin:0 0 12px;font-size:22px">Confirm your account</h1>
        <p style="margin:0 0 22px;line-height:1.6;color:#475569">Confirm your email address to finish creating your scouting account.</p>
        <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=signup" style="display:inline-block;background:#dc2626;color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:7px">Confirm email</a>
        <p style="margin:22px 0 0;font-size:12px;line-height:1.6;color:#64748b">If you did not create this account, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>
